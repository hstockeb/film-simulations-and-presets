# Publish the before/after site to GitHub Pages.
#
# The site is site/index.html + site/looks.json; the renders and the presets it
# links to are copied in beside it, so every path in looks.json resolves.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, samples/**, presets/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R samples presets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
